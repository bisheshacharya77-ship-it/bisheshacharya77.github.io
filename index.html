<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bishesh — Socials</title>

    <meta name="description" content="Find Bishesh on social media.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            background: #050505;
            overflow-x: hidden;
        }

        /* Animated background */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #ffffff;
            opacity: 0.035;
            filter: blur(130px);
            border-radius: 50%;
            top: -180px;
            left: -150px;
            animation: float1 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #888;
            opacity: 0.04;
            filter: blur(130px);
            border-radius: 50%;
            bottom: -180px;
            right: -150px;
            animation: float2 10s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes float1 {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(100px, 80px);
            }
        }

        @keyframes float2 {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(-100px, -80px);
            }
        }

        /* Main */

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 50px 18px;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 470px;
            text-align: center;
            animation: appear 0.8s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile */

        .profile-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(145deg, #242424, #080808);

            border: 1px solid rgba(255,255,255,0.25);

            box-shadow:
                0 0 35px rgba(255,255,255,0.08),
                inset 0 0 25px rgba(255,255,255,0.04);

            font-size: 40px;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .online {
            position: absolute;
            width: 16px;
            height: 16px;
            right: 3px;
            bottom: 8px;
            background: #fff;
            border-radius: 50%;
            border: 4px solid #050505;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.8px;
            margin-bottom: 7px;
        }

        .username {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .bio {
            color: #b5b5b5;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Social links */

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            position: relative;
            width: 100%;
            min-height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 15px 55px;

            color: white;
            text-decoration: none;

            background: rgba(255,255,255,0.055);
            border: 1px solid rgba(255,255,255,0.11);

            border-radius: 17px;

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;

            animation: slide 0.6s ease backwards;
        }

        .link:nth-child(1) {
            animation-delay: 0.1s;
        }

        .link:nth-child(2) {
            animation-delay: 0.2s;
        }

        .link:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes slide {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link:hover {
            transform: translateY(-4px) scale(1.01);

            background: rgba(255,255,255,0.10);

            border-color: rgba(255,255,255,0.25);

            box-shadow:
                0 12px 35px rgba(0,0,0,0.35),
                0 0 20px rgba(255,255,255,0.04);
        }

        .link:active {
            transform: scale(0.98);
        }

        .icon {
            position: absolute;
            left: 20px;

            width: 25px;
            height: 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
        }

        .arrow {
            position: absolute;
            right: 20px;

            color: #666;
            font-size: 19px;

            transition: 0.25s;
        }

        .link:hover .arrow {
            color: #fff;
            transform: translateX(4px);
        }

        .link-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.1px;
        }

        /* Divider */

        .divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.07);
            margin: 30px 0 20px;
        }

        /* Footer */

        .footer {
            color: #555;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding-bottom: 20px;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .page {
                padding: 35px 16px;
            }

            .profile,
            .profile-wrapper {
                width: 95px;
                height: 95px;
            }

            .profile {
                font-size: 34px;
            }

            h1 {
                font-size: 27px;
            }

            .link {
                min-height: 59px;
            }
        }
    </style>
</head>


<body>

<div class="page">

    <main class="container">

        <!-- Profile -->

        <div class="profile-wrapper">

            <div class="profile">
                B
            </div>

            <div class="online"></div>

        </div>


        <h1>Bishesh</h1>

        <div class="username">
            @bisheshacharya77
        </div>

        <div class="bio">
            Just another human on the internet.<br>
            Find me around the web ↓
        </div>


        <!-- Social Links -->

        <div class="links">

            <!-- Instagram -->

            <a
                class="link"
                href="https://www.instagram.com/bish.esh68/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">◎</span>

                <span class="link-text">
                    Instagram
                </span>

                <span class="arrow">
                    →
                </span>

            </a>


            <!-- Facebook -->

            <a
                class="link"
                href="https://www.facebook.com/bishesh.acharya.14"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">f</span>

                <span class="link-text">
                    Facebook
                </span>

                <span class="arrow">
                    →
                </span>

            </a>


            <!-- YouTube -->

            <a
                class="link"
                href="https://www.youtube.com/@bishesh9218"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="icon">▶</span>

                <span class="link-text">
                    YouTube
                </span>

                <span class="arrow">
                    →
                </span>

            </a>

        </div>


        <div class="divider"></div>


        <div class="footer">
            © 2026 Bishesh
        </div>

    </main>

</div>

</body>
</html>
